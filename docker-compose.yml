name: poker-next-gen

include:
  - docker-compose.oddslingers.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: poker-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
    ports:
      - "5433:5432" # host 5433 avoids conflict with local Postgres on :5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - poker-net

  engine-math:
    build:
      context: ./engine-math
      dockerfile: Dockerfile
    container_name: poker-engine-math
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - poker-net

  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: poker-backend-core
    depends_on:
      postgres:
        condition: service_healthy
      engine-math:
        condition: service_healthy
    environment:
      DATABASE_ADDRESS: postgres:localdb@postgres:5432/nakama
      NAKAMA_LOG_LEVEL: INFO
      ENGINE_MATH_URL: http://engine-math:8080
      # Read by rpc/subscription_stripe.go for Stripe return/cancel URLs. Unset,
      # it falls back to the placeholder https://app.example.com and every
      # checkout redirect points at a domain nobody owns. Railway sets this to
      # the frontend's public domain; under compose the frontend is on :3000.
      APP_BASE_URL: http://localhost:3000
      # Read by rpc/deposit.go and handed to NOWPayments as the IPN callback.
      # Unset, it is empty and crypto deposit confirmations are never delivered
      # — the invoice is created and the wallet is never credited. Mirrors the
      # Railway value: backend-core's own nowpayments_webhook RPC. defaulthttpkey
      # is Nakama's dev default (the server warns about it); production sets a
      # real NAKAMA_HTTP_KEY.
      NOWPAYMENTS_IPN_CALLBACK_URL: http://localhost:7350/v2/rpc/nowpayments_webhook?http_key=defaulthttpkey&unwrap
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - poker-net

  frontend-table:
    image: node:22-alpine
    container_name: poker-frontend-table
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_NAKAMA_HOST: http://localhost:7350
      NAKAMA_HOST: http://backend-core:7350
      NAKAMA_SERVER_KEY: defaultkey
      # Browser-visible twin of NAKAMA_SERVER_KEY. lib/nakama/client.ts and
      # diag/page.tsx fall back to "defaultkey" if it is missing, but
      # app/api/health/nakama/route.ts reads it with NO fallback and would
      # report serverKey: undefined. Railway sets it; compose did not.
      NEXT_PUBLIC_NAKAMA_SERVER_KEY: defaultkey
      ENGINE_MATH_URL: http://engine-math:8080
      ODDSLINGERS_URL: http://oddslingers-nginx:80
      RUNNING_IN_COMPOSE: "1"
      NEXT_PUBLIC_ODDSLINGERS_URL: http://localhost:8888
      NEXT_PUBLIC_ENGINE_MATH_URL: http://localhost:8080
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend-table:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend-core:
        condition: service_started
      engine-math:
        condition: service_started
    networks:
      - poker-net

networks:
  poker-net:
    driver: bridge

volumes:
  postgres-data:
