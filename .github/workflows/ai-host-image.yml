name: Build AI-host image

# Builds ai-host/'s Docker image on GitHub's own servers and publishes it to
# GitHub Container Registry (ghcr.io) — no Docker install needed on any
# developer's machine. Pipecat Cloud then deploys that already-built image
# (ai-host/pcc-deploy.toml's `image` field points at it) rather than building
# anything itself.
on:
  push:
    branches: ["**"]
    paths:
      - "ai-host/**"
      - ".github/workflows/ai-host-image.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ai-host
          # Pipecat Cloud requires linux/arm64 images — GitHub's runners are
          # amd64 by default, so this cross-builds via the QEMU step above.
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/poker-ai-host:latest
            ghcr.io/${{ github.repository_owner }}/poker-ai-host:${{ github.sha }}
